name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, port/cloudflare]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and acceptance suite
    runs-on: tenki-standard-medium-4c-8g
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Postgres 18 (the registry's database, as on Neon)
        # The registry unit tests and the acceptance suite start a throwaway cluster with initdb (tests/acceptance/postgres.ts).
        # PGDG's Postgres 18 when the runner's Ubuntu has it, else the distro's Postgres.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          if sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y -qq postgresql-18; then :; else sudo apt-get install -y -qq postgresql; fi
          sudo systemctl stop postgresql || true
          ls /usr/lib/postgresql/*/bin/initdb
      - run: bun install --frozen-lockfile
      - name: Typecheck (root, the registry Worker against workers-types, the Alchemy stack)
        run: bun run typecheck
      - name: Lint (Oxlint with anti-slop and @shadcn/lint, against lint-baseline.json)
        run: bun run lint
      - name: Vendored anti-slop rule tests
        # The CLI rule test spawns `pnpm exec oxlint`; pnpm is a repo devDependency, so put node_modules/.bin on PATH.
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          for f in tools/oxlint/anti-slop/rules/*.test.ts tools/oxlint/anti-slop/effect/rules/*.test.ts; do node "$f"; done
      - name: Unit tests
        run: bun test packages/cli/test packages/core/test packages/registry/test packages/infra/test
      - name: Web unit tests
        run: bun test lib
        working-directory: apps/web
      - name: Typecheck web (route types come from next typegen)
        run: bunx next typegen && bunx tsc --noEmit
        working-directory: apps/web
      - name: Docs site (Blume build, then a strict link check that fails on any navigation warning)
        run: bun run build && bun run validate
        working-directory: apps/docs
      - name: Acceptance suite (real bun, npm and pnpm against the registry Worker build in Miniflare and Postgres 18)
        run: |
          bun scripts/score.ts | tee score.txt
          test "$(tail -n 1 score.txt)" = "0"
