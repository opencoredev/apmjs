name: Appeal a score
description: A piece of evidence in a version's apm score is wrong
title: "Appeal: <package>@<version>"
labels: ["score-appeal"]
body:
  - type: markdown
    attributes:
      value: |
        A person at apm reads each appeal. If the evidence is wrong, they dismiss that one item for that exact version; the score is recomputed without it, the version page keeps it visible, struck through, with the reason, and the dismissal goes into the package's public log. A dismissal does not carry over to other versions. The apm docs explain it under "Appealing a score".
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: vite@8.3.8
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: The evidence you are appealing
      description: The signal and the cited line, copied from the version page.
      placeholder: "credential-access: dist/node/chunks/config.js:25134: deny: ['.env', '.env.*', '*.{crt,pem}', '**/.npmrc']"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What the code does with it. Link to the source if it helps.
    validations:
      required: true
